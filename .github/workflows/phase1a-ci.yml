name: Phase 1A Governance Hardening CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static schema check
        run: bash tests/static/check_schema.sh
      - name: Deployment path regression check
        run: bash tests/static/check_deployment_path.sh

  postgres-acceptance:
    runs-on: ubuntu-latest
    needs: static-check
    env:
      # 与 postgres service 容器使用相同的测试库和管理员身份，
      # 确保 db/init/002_init_roles.sh 和 003_apply_migrations.sh 隐式连接时不落入默认 postgres 库。
      POSTGRES_USER: postgres
      POSTGRES_DB: longyuan_ci
      PGHOST: localhost
      PGPORT: "5432"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: longyuan_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Load schema
        env:
          PGPASSWORD: ci-test
        run: |
          psql -h localhost -U postgres -d longyuan_ci -v ON_ERROR_STOP=1 \
            < db/init/001_agent_native_schema.sql
      - name: Init roles
        env:
          PGPASSWORD: ci-test
          WEB_DATABASE_URL: postgresql://app_rw:change-me@localhost:5432/longyuan_ci
          WORKER_DATABASE_URL: postgresql://worker_candidate_rw:change-me@localhost:5432/longyuan_ci
          SCHEDULER_DATABASE_URL: postgresql://scheduler_jobs_rw:change-me@localhost:5432/longyuan_ci
          APPROVAL_EVENT_WRITER_DATABASE_URL: postgresql://approval_event_writer:change-me@localhost:5432/longyuan_ci
          READONLY_DATABASE_URL: postgresql://app_readonly:change-me@localhost:5432/longyuan_ci
        run: |
          bash db/init/002_init_roles.sh
      - name: Prepare migrations path
        run: |
          # 003_apply_migrations.sh 固定读取 /db/migrations，与 docker-compose 部署路径一致
          sudo mkdir -p /db
          sudo cp -r "${GITHUB_WORKSPACE}/db/migrations" /db/migrations
      - name: Apply migrations
        env:
          PGPASSWORD: ci-test
        run: |
          bash db/init/003_apply_migrations.sh
      - name: Load fixtures
        env:
          PGPASSWORD: ci-test
        run: |
          psql -h localhost -U postgres -d longyuan_ci -v ON_ERROR_STOP=1 \
            < tests/fixtures/000_test_roles.sql
          psql -h localhost -U postgres -d longyuan_ci -v ON_ERROR_STOP=1 \
            < tests/fixtures/010_seed.sql
      - name: Run acceptance tests
        env:
          PGPASSWORD: ci-test
        run: |
          set -euo pipefail
          PHASE1A="10_event_immutability 20_candidate_isolation 30_idempotency \
                   50_recovery 60_governance_redlines 70_permissions \
                   80_phase1a_governance 81_phase1a_audit"
          echo "40_full_loop.sql — PENDING（Phase 4–6）"
          fails=0
          for name in $PHASE1A; do
            f="tests/acceptance/${name}.sql"
            echo ">> RUN ${name}"
            # 1) seed（失败即整步失败，绝不吞错）
            psql -h localhost -U postgres -d longyuan_ci -v ON_ERROR_STOP=1 \
              -f tests/fixtures/010_seed.sql
            # 2) 始终回滚地执行测试文件
            if { echo "BEGIN;"; cat "$f"; echo "ROLLBACK;"; } \
                 | psql -h localhost -U postgres -d longyuan_ci -v ON_ERROR_STOP=1; then
              echo "   PASS ${name}"
            else
              echo "   FAIL ${name}"; fails=$((fails+1))
            fi
          done
          [ "$fails" -eq 0 ] || { echo "Phase 1A: ${fails} file(s) FAIL"; exit 1; }
          echo "Phase 1A acceptance: PASS（40_full_loop PENDING）"
